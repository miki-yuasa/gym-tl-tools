[project]
name = "gym-tl-tools"
version = "0.1.0"
description = "Utilities to wrap gymnasium environments using TL rewards."
authors = [{ name = "Mikihisa Yuasa", email = "myuasa2@illinois.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "spottl>=2.13,<3.0",
    "numpy>=1.21",
    "gymnasium>=0.26",
    "pydantic>=2.0,<3.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://miki-yuasa.github.io/gym-tl-tools"
Repository = "https://github.com/miki-yuasa/gym-tl-tools"           # ソースコードの場所
"Bug Tracker" = "https://github.com/miki-yuasa/gym-tl-tools/issues" # バグ報告用のURL

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
gym-multigrid = { git = "https://github.com/LIRA-illinois/gym-multigrid", rev = "dev" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "gym-multigrid",
    "pytest>=8.4.1",
    "sphinx>=8.1.3",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-rtd-theme>=3.0.2",
]
lint = ["ruff>=0.12.8"]

[tool.ruff]
line-length = 80


[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "D",   # pydocstyle (Google convention)
    "ANN", # flake8-annotations
    "UP",  # pyupgrade (generics, modern syntax)
    "PTH", # flake8-use-pathlib (enforce pathlib over os.path)
    "BLE", # flake8-blind-except (no bare except or except Exception)
    "TRY", # tryceratops (exception handling idioms)
    "S",   # flake8-bandit (security, asserts)
    "RET", # flake8-return (direct returns)
    "B",   # flake8-bugbear (common design gotchas)
    "TID", # flake8-tidy-imports (banned APIs)
    "FLY", # flynt (f-string formatting)
    "RUF", # Ruff-specific rules
]

ignore = [
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "ANN401", # Dynamically typed expressions (Any)
    "TRY003", # Avoid specifying long messages outside exception class
    "D107",   # Missing docstring in __init__ (documented in class)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"dataclasses.dataclass" = { msg = "Use Pydantic's dataclass ('from pydantic.dataclasses import dataclass') or BaseModel instead." }
"os.path" = { msg = "Use pathlib.Path instead of os.path functions." }

[tool.ruff.lint.per-file-ignores]
"*_test.py" = [
    "S101",   # asserts allowed in unit tests
    "D100",   # module docstring not required in test modules
    "D101",   # class docstring not required in test modules
    "D102",   # method docstrings not required in test methods
    "D103",   # test function docstrings not required
    "ANN201", # return type annotations not required for test methods
]
"test_*.py" = ["S101", "D100", "D101", "D102", "D103", "ANN201"]
"check_lint_hook.py" = [
    "S603", # Subprocess invocation required for hook execution
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
